<nav class="navbar navbar-expand-lg fixed-top bg-white border-bottom">

  <div class="container px-4">

    <!-- ========================= -->
    <!-- LOGO -->
    <!-- ========================= -->

    <a
      class="navbar-brand me-4"
      routerLink="/home"
      (click)="closeMobileMenu()"
    >

      <div class="logo-box">

       <img
          src="../../../../assets/images/17811630385f22638f-640b-41f5-8bfd-e19ff18591a1-removebg-previewpng.png"
          alt="King Cotto"
          class="footer-logo"
        >


      </div>

    </a>


    <!-- ========================= -->
    <!-- MOBILE TOGGLE -->
    <!-- ========================= -->

    <button
      class="navbar-toggler"
      type="button"
      aria-label="Toggle navigation"
      [class.active]="mobileMenuOpen"
      (click)="toggleMobileMenu()"
      (mouseenter)="openMobileMenu()"
    >

      <span class="navbar-toggler-icon"></span>

    </button>


    <!-- ========================= -->
    <!-- NAVBAR CONTENT -->
    <!-- ========================= -->

    <div
      class="navbar-collapse"
      [class.show]="mobileMenuOpen"
      (mouseenter)="openMobileMenu()"
    >


      <!-- ========================= -->
      <!-- NAVIGATION LINKS -->
      <!-- ========================= -->

      <ul
        class="navbar-nav me-auto mb-2 mb-lg-0 fw-semibold text-uppercase"
      >

        <!-- HOME -->

        <li class="nav-item">

          <a
            class="nav-link px-3 text-dark"
            routerLink="/home"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMobileMenu()"
          >
            HOME
          </a>

        </li>


        <!-- PRODUCTS -->

        <li class="nav-item">

          <a
            class="nav-link px-3 text-dark"
            routerLink="/products"
            routerLinkActive="active"
            (click)="closeMobileMenu()"
          >
            PRODUCTS
          </a>

        </li>


        <!-- CONTACT -->

        <li class="nav-item">

          <a
            class="nav-link px-3 text-dark"
            routerLink="/contactus"
            routerLinkActive="active"
            (click)="closeMobileMenu()"
          >
            CONTACT US
          </a>

        </li>

      </ul>


      <!-- ========================= -->
      <!-- RIGHT SIDE -->
      <!-- ========================= -->

      <div class="navbar-right">


        <!-- ========================= -->
        <!-- SEARCH -->
        <!-- ========================= -->

        <form
          class="search-group"
          (ngSubmit)="searchProducts()"
        >

          <!-- SEARCH INPUT -->

          <input
            type="text"
            class="search-input"
            [(ngModel)]="searchTerm"
            name="search"
            placeholder="Search Any Product Here"
            autocomplete="off"
          >


          <!-- CATEGORY -->

          <div class="category-wrapper">

            <button
              type="button"
              class="category-button"
              (click)="toggleCategories()"
            >

           <span>
  {{ selectedCategoryName }}
</span>

              <i class="bi bi-caret-down-fill"></i>

            </button>


            <!-- CATEGORY DROPDOWN -->

            <div
              class="category-dropdown"
              *ngIf="showCategories"
            >

              <!-- ALL -->

              <button
                type="button"
                class="category-item"
                (click)="selectAllCategories()"
              >
                All Categories
              </button>


              <!-- CATEGORIES -->

              <button
                type="button"
                class="category-item"
                *ngFor="let category of categories"
                (click)="selectCategory(category.id)"
              >

                {{ category.name }}

              </button>

            </div>

          </div>


          <!-- SEARCH BUTTON -->

          <button
            class="search-button"
            type="submit"
            aria-label="Search"
          >

            <i class="bi bi-search"></i>

          </button>

        </form>


        <!-- ========================= -->
        <!-- ACCOUNT + ICONS -->
        <!-- ========================= -->

        <div class="account-actions">


          <!-- USER -->

          <div class="user-account">


            <!-- LOGGED IN -->

            <ng-container
              *ngIf="isLoggedIn && currentUser; else guestAccount"
            >

              <div class="user-welcome text-end">

                <small class="text-muted d-block">
                  Welcome
                </small>

                <span class="fw-semibold">
                  {{ currentUser.full_name || currentUser.email }}
                </span>

              </div>


              <button
                type="button"
                class="btn btn-outline-danger btn-sm"
                (click)="logout()"
              >

                <i class="bi bi-box-arrow-right me-1"></i>

                Logout

              </button>

            </ng-container>


            <!-- GUEST -->

            <ng-template #guestAccount>

              <a
                routerLink="/login"
                class="btn btn-outline-primary btn-sm"
                (click)="closeMobileMenu()"
              >

                <i class="bi bi-person me-1"></i>

                Login

              </a>


              <a
                routerLink="/register"
                class="btn btn-primary btn-sm"
                (click)="closeMobileMenu()"
              >

                Register

              </a>

            </ng-template>

          </div>


          <!-- ========================= -->
          <!-- WISHLIST -->
          <!-- ========================= -->

          <a
            routerLink="/login"
            class="action-icon-btn position-relative"
            aria-label="Wishlist"
            (click)="closeMobileMenu()"
          >

            <i class="bi bi-heart fs-5"></i>

            <!-- <span class="badge-count">
              
            </span> -->

          </a>


          <!-- ========================= -->
          <!-- CART -->
          <!-- ========================= -->

          <a
            routerLink="/cart"
            class="action-icon-btn position-relative"
            aria-label="Shopping cart"
            (click)="closeMobileMenu()"
          >

            <i class="bi bi-cart3 fs-5"></i>

            <span
              class="badge-count"
              *ngIf="cartItemsCount > 0"
            >
              {{ cartItemsCount }}
            </span>

          </a>


        </div>

      </div>

    </div>

  </div>

</nav>
